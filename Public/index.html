<script>
    lucide.createIcons();

    // ================= KONFIGURASI LIMIT =================
    const MAX_TOTAL_SIZE_MB = 300;
    const WARN_TOTAL_SIZE_MB = 100;

    // ================= NAVIGASI TAB =================
    function switchTab(viewId, btnElement) {
        document.querySelectorAll('.view-section').forEach(view => view.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.classList.remove('bg-[var(--glass-bg)]', 'shadow-sm', 'font-medium');
            btn.classList.add('text-[var(--text-muted)]');
        });
        btnElement.classList.remove('text-[var(--text-muted)]');
        btnElement.classList.add('bg-[var(--glass-bg)]', 'shadow-sm', 'font-medium');
        if (viewId === 'history-view') renderHistory();
    }

    // ================= TOKEN (sama seperti sebelumnya) =================
    function toggleToken() {
        const input = document.getElementById('tokenInput');
        const icon = document.getElementById('eyeIcon');
        input.type = input.type === 'password' ? 'text' : 'password';
        icon.setAttribute('data-lucide', input.type === 'password' ? 'eye' : 'eye-off');
        lucide.createIcons();
    }
    const tokenInput = document.getElementById('tokenInput');
    const clearTokenBtn = document.getElementById('clearTokenBtn');
    const tokenStatusBadge = document.getElementById('tokenStatusBadge');
    function checkTokenStatus() {
        if (tokenInput.value.trim() !== '') {
            tokenStatusBadge.innerText = 'Aktif';
            tokenStatusBadge.classList.remove('bg-white/5', 'text-white/40');
            tokenStatusBadge.classList.add('bg-white/15', 'text-white', 'border-white/30');
            clearTokenBtn.classList.remove('hidden');
        } else {
            tokenStatusBadge.innerText = 'Belum diisi';
            tokenStatusBadge.classList.add('bg-white/5', 'text-white/40');
            tokenStatusBadge.classList.remove('bg-white/15', 'text-white', 'border-white/30');
            clearTokenBtn.classList.add('hidden');
        }
    }
    const savedToken = localStorage.getItem('zamzzx_vercel_token');
    if (savedToken) tokenInput.value = savedToken;
    checkTokenStatus();
    tokenInput.addEventListener('input', (e) => {
        if (e.target.value.trim() !== '') localStorage.setItem('zamzzx_vercel_token', e.target.value);
        else localStorage.removeItem('zamzzx_vercel_token');
        checkTokenStatus();
    });
    clearTokenBtn.addEventListener('click', () => {
        tokenInput.value = '';
        localStorage.removeItem('zamzzx_vercel_token');
        checkTokenStatus();
    });

    // ================= THEME =================
    function setTheme(isLight) {
        const body = document.body;
        const btnGelap = document.getElementById('btn-gelap');
        const btnTerang = document.getElementById('btn-terang');
        const themeDesc = document.getElementById('theme-desc');
        if (isLight) {
            body.classList.add('light-mode');
            btnTerang.classList.add('bg-white', 'text-black', 'shadow-sm');
            btnTerang.classList.remove('text-[var(--text-muted)]');
            btnGelap.classList.remove('bg-[var(--glass-bg)]', 'shadow-sm');
            btnGelap.classList.add('text-[var(--text-muted)]');
            themeDesc.innerText = 'Mode terang aktif — kaca putih transparan.';
        } else {
            body.classList.remove('light-mode');
            btnGelap.classList.add('bg-[var(--glass-bg)]', 'shadow-sm');
            btnGelap.classList.remove('text-[var(--text-muted)]');
            btnTerang.classList.remove('bg-white', 'text-black', 'shadow-sm');
            btnTerang.classList.add('text-[var(--text-muted)]');
            themeDesc.innerText = 'Mode gelap aktif — kaca abu-abu pekat.';
        }
        lucide.createIcons();
    }

    // ================= UPLOAD FILE =================
    const dropZone = document.getElementById('dropZone');
    const zipInput = document.getElementById('zipInput');
    const fileInput = document.getElementById('fileInput');
    const fileInputFiles = document.getElementById('fileInputFiles');
    const fileList = document.getElementById('fileList');
    const sizeWarning = document.getElementById('sizeWarning');
    const sizeWarningText = document.getElementById('sizeWarningText');
    let selectedFiles = [];

    dropZone.addEventListener('click', (e) => {
        if (e.target.closest('button')) return;
        fileInputFiles.click();
    });

    [fileInput, fileInputFiles, zipInput].forEach(input => {
        input.addEventListener('change', (e) => {
            selectedFiles = Array.from(e.target.files);
            validateAndShowFiles();
        });
    });

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('bg-[var(--glass-border)]'); });
    dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.classList.remove('bg-[var(--glass-border)]'); });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('bg-[var(--glass-border)]');
        selectedFiles = Array.from(e.dataTransfer.files);
        validateAndShowFiles();
    });

    function getTotalSizeMB(files) {
        return files.reduce((acc, f) => acc + f.size, 0) / (1024 * 1024);
    }

    function validateAndShowFiles() {
        const totalMB = getTotalSizeMB(selectedFiles);
        sizeWarning.classList.add('hidden');
        if (totalMB > MAX_TOTAL_SIZE_MB) {
            sizeWarning.classList.remove('hidden');
            sizeWarningText.innerText = `Total file ${totalMB.toFixed(2)} MB melebihi batas ${MAX_TOTAL_SIZE_MB} MB.`;
        } else if (totalMB > WARN_TOTAL_SIZE_MB) {
            sizeWarning.classList.remove('hidden');
            sizeWarningText.innerText = `Ukuran total ${totalMB.toFixed(2)} MB cukup besar. Deploy mungkin memakan waktu.`;
        }
        updateFileList(selectedFiles);
    }

    function updateFileList(files) {
        fileList.innerHTML = '';
        if (files.length > 0) {
            const totalMB = getTotalSizeMB(files);
            const summary = document.createElement('div');
            summary.className = 'flex items-center justify-between text-[10px] text-white/40 px-1 mb-1';
            const isZip = files.length === 1 && files[0].name.toLowerCase().endsWith('.zip');
            summary.innerHTML = `<span>${isZip ? '📦 ZIP terdeteksi' : files.length + ' file dipilih'}</span><span>Total: ${totalMB.toFixed(2)} MB / ${MAX_TOTAL_SIZE_MB} MB</span>`;
            fileList.appendChild(summary);
            files.slice(0, 50).forEach(file => {
                const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
                const isZipFile = file.name.toLowerCase().endsWith('.zip');
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between text-xs text-[var(--text-muted)] bg-[var(--input-bg)] border border-[var(--glass-border)] p-3 rounded-xl';
                div.innerHTML = `<span class="truncate max-w-[200px] font-medium ${isZipFile ? 'text-amber-400' : 'text-white'} flex items-center gap-1.5">${isZipFile ? '📦' : ''}${file.webkitRelativePath || file.name}</span> <span class="text-[10px] bg-[var(--glass-bg)] px-2 py-1 rounded-md">${sizeMB} MB</span>`;
                fileList.appendChild(div);
            });
            if (files.length > 50) {
                const more = document.createElement('p');
                more.className = 'text-[10px] text-white/40 text-center py-2';
                more.innerText = `... dan ${files.length - 50} file lainnya`;
                fileList.appendChild(more);
            }
        }
    }

    // ================= FAVICON =================
    let faviconFile = null;
    document.getElementById('faviconInput').addEventListener('change', function() {
        if (this.files && this.files[0]) {
            faviconFile = this.files[0];
            const icon = document.getElementById('faviconIcon');
            icon.setAttribute('data-lucide', 'check-circle');
            icon.classList.remove('text-[var(--text-muted)]');
            icon.classList.add('text-white');
            lucide.createIcons();
        }
    });

    // ================= HELPER: EKSTRAK ZIP =================
    async function extractZip(zipFile, onProgress) {
        const zip = await JSZip.loadAsync(zipFile);
        const entries = [];
        const promises = [];
        let count = 0;
        zip.forEach((relativePath, zipEntry) => {
            if (zipEntry.dir) return;
            count++;
            const p = zipEntry.async('blob').then(blob => {
                const baseName = relativePath.split('/').pop();
                const file = new File([blob], baseName, { type: 'application/octet-stream' });
                Object.defineProperty(file, 'customPath', { value: relativePath, writable: true });
                entries.push(file);
                if (onProgress) onProgress(entries.length, count);
            });
            promises.push(p);
        });
        await Promise.all(promises);
        return entries;
    }

    function getCommonPrefix(files) {
        if (files.length === 0) return '';
        const paths = files.map(f => f.customPath || f.webkitRelativePath || f.name);
        if (!paths[0].includes('/')) return '';
        const parts = paths[0].split('/');
        let prefix = '';
        for (let i = 0; i < parts.length - 1; i++) {
            const test = prefix + parts[i] + '/';
            if (paths.every(p => p.startsWith(test))) prefix = test;
            else break;
        }
        return prefix;
    }

    // ================= DEPLOY =================
    const deployModal = document.getElementById('deployModal');
    const deployStatusText = document.getElementById('deployStatusText');
    const deploySubText = document.getElementById('deploySubText');
    const deployProgressBar = document.getElementById('deployProgressBar');
    const deployPercentText = document.getElementById('deployPercentText');
    const deployStepText = document.getElementById('deployStepText');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const resultBox = document.getElementById('resultBox');
    const resultLink = document.getElementById('resultLink');
    const spinnerRing = document.getElementById('spinnerRing');

    function updateProgress(percent, status, subtext, stepLabel) {
        deployProgressBar.style.width = percent + '%';
        deployPercentText.innerText = percent + '%';
        if (status) deployStatusText.innerText = status;
        if (subtext) deploySubText.innerText = subtext;
        if (stepLabel) deployStepText.innerText = stepLabel;
    }

    async function startDeploy() {
        const token = localStorage.getItem('zamzzx_vercel_token');
        const subdomain = document.getElementById('subdomainInput').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-');
        let files = selectedFiles;

        if (!token) { alert('Token Vercel belum diisi!'); return; }
        if (!subdomain) { alert('Nama subdomain belum diisi!'); return; }
        if (files.length === 0) { alert('Pilih file website terlebih dahulu!'); return; }

        const totalMB = getTotalSizeMB(files);
        if (totalMB > MAX_TOTAL_SIZE_MB) {
            alert(`Total file ${totalMB.toFixed(2)} MB melebihi batas ${MAX_TOTAL_SIZE_MB} MB.`);
            return;
        }

        deployModal.classList.remove('hidden');
        deployModal.classList.add('flex');
        closeModalBtn.classList.add('hidden');
        resultBox.classList.add('hidden');
        spinnerRing.style.display = 'block';
        deployProgressBar.classList.remove('bg-emerald-500', 'bg-red-500');
        deployProgressBar.classList.add('bg-white');
        updateProgress(0, 'Memulai Proses...', 'Menyiapkan data', 'Menyiapkan...');

        try {
            // Ekstrak ZIP jika perlu
            const isSingleZip = files.length === 1 && files[0].name.toLowerCase().endsWith('.zip');
            if (isSingleZip) {
                updateProgress(5, 'Mengekstrak ZIP...', 'Membaca isi arsip', 'Extracting');
                files = await extractZip(files[0], (done, total) => {
                    const pct = 5 + Math.floor((done / total) * 15);
                    updateProgress(pct, 'Mengekstrak ZIP...', `${done}/${total} file`, 'Extracting');
                });
                updateProgress(20, 'Ekstrak selesai', `${files.length} file siap`, 'Extracted');
            }

            // Strip common prefix
            const prefix = getCommonPrefix(files);

            // Bangun FormData
            const formData = new FormData();
            formData.append('token', token);
            formData.append('subdomain', subdomain);

            let sentCount = 0;
            for (const file of files) {
                let path = file.customPath || file.webkitRelativePath || file.name;
                if (prefix && path.startsWith(prefix)) path = path.substring(prefix.length);
                if (path.startsWith('/')) path = path.substring(1);
                formData.append('files', file, path);
                sentCount++;
                const pct = 25 + Math.floor((sentCount / files.length) * 10);
                updateProgress(pct, 'Menyiapkan file...', `${sentCount}/${files.length}`, 'Preparing');
            }

            if (faviconFile) {
                formData.append('favicon', faviconFile, faviconFile.name);
            }

            // Kirim ke backend
            updateProgress(40, 'Mengunggah ke server...', `${files.length} file sedang diproses`, 'Uploading');
            
            let uploadProgress = 40;
            const uploadInterval = setInterval(() => {
                if (uploadProgress < 88) {
                    uploadProgress += 2;
                    updateProgress(uploadProgress, 'Memproses di server...', 'Server sedang upload ke Vercel', 'Processing');
                }
            }, 700);

            const response = await fetch('/api/deploy', {
                method: 'POST',
                body: formData
            });

            clearInterval(uploadInterval);
            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || 'Gagal deploy.');
            }

            updateProgress(100, 'Deploy Berhasil! 🎉', 'Website sudah live', 'Success');
            deployProgressBar.classList.remove('bg-white');
            deployProgressBar.classList.add('bg-emerald-500');
            spinnerRing.style.display = 'none';
            closeModalBtn.classList.remove('hidden');
            resultBox.classList.remove('hidden');
            resultLink.href = result.url;
            resultLink.innerText = result.url;

            saveToHistory({
                url: result.url,
                name: subdomain,
                date: new Date().toLocaleString('id-ID'),
                files: files.length + (faviconFile ? 1 : 0)
            });

        } catch (error) {
            console.error(error);
            updateProgress(100, 'Deploy Gagal ❌', error.message, 'Error');
            deployProgressBar.classList.remove('bg-white');
            deployProgressBar.classList.add('bg-red-500');
            spinnerRing.style.display = 'none';
            closeModalBtn.classList.remove('hidden');
        }
    }

    function closeDeployModal() {
        deployModal.classList.add('hidden');
        deployModal.classList.remove('flex');
    }

    // ================= HISTORY =================
    function saveToHistory(data) {
        let history = JSON.parse(localStorage.getItem('zamzzx_deploy_history') || '[]');
        history.unshift(data);
        if (history.length > 20) history = history.slice(0, 20);
        localStorage.setItem('zamzzx_deploy_history', JSON.stringify(history));
    }

    function renderHistory() {
        const history = JSON.parse(localStorage.getItem('zamzzx_deploy_history') || '[]');
        const historyEmpty = document.getElementById('historyEmpty');
        const historyList = document.getElementById('historyList');
        if (history.length === 0) {
            historyEmpty.style.display = 'flex';
            historyList.innerHTML = '';
            return;
        }
        historyEmpty.style.display = 'none';
        historyList.innerHTML = '';
        history.forEach(item => {
            const div = document.createElement('a');
            div.href = item.url;
            div.target = '_blank';
            div.className = 'glass-panel p-4 flex items-center justify-between hover:bg-[var(--glass-border)] transition-colors block';
            div.innerHTML = `
                <div class="flex items-center gap-3 overflow-hidden">
                    <div class="w-10 h-10 bg-[var(--input-bg)] border border-[var(--glass-border)] rounded-xl flex items-center justify-center shrink-0">
                        <i data-lucide="globe" size="16" class="text-current opacity-70"></i>
                    </div>
                    <div class="overflow-hidden">
                        <p class="text-sm font-medium truncate">${item.name}</p>
                        <p class="text-[10px] text-[var(--text-muted)] mt-0.5">${item.date} • ${item.files} file</p>
                    </div>
                </div>
                <i data-lucide="external-link" size="16" class="text-[var(--text-muted)] shrink-0 ml-2"></i>
            `;
            historyList.appendChild(div);
        });
        lucide.createIcons();
    }
</script>
